<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeemO</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-text">
          <div class="brand-name">Teem<span class="o">O</span></div>
          <div class="brand-tag">AI가 분석하는 나만의 독서 취향</div>
        </div>
      </div>
      <div class="masthead-date" id="masthead-date">
        <span class="md-orn" aria-hidden="true">❦</span>
        <div class="md-stack">
          <span class="md-label">오늘의 서재</span>
          <span class="md-date" id="md-date"></span>
        </div>
        <span class="md-orn" aria-hidden="true">❦</span>
      </div>
      <div class="avatar">나</div>
    </header>
    <div class="masthead-rule" aria-hidden="true"></div>

    <!-- 통계 -->
    <section class="stats-row pop" id="stats-dashboard" aria-label="독서 통계">
      <div class="stat-w stat-books">
        <div class="stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
        <div class="stat-txt"><div class="v" id="stat-count">—</div><div class="l">읽은 책</div></div>
      </div>
      <div class="stat-w stat-rating">
        <div class="stat-ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 5.9 6.5.95-4.7 4.58 1.1 6.47L12 17.4l-5.8 3.05 1.1-6.47-4.7-4.58 6.5-.95z"/></svg></div>
        <div class="stat-txt"><div class="v" id="stat-avg">—</div><div class="l">평균 별점</div></div>
      </div>
      <div class="stat-w stat-genre">
        <div class="stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 3 12V5a2 2 0 0 1 2-2h7a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.6z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/></svg></div>
        <div class="stat-txt"><div class="v" id="stat-genre">—</div><div class="l">최애 장르</div></div>
      </div>
    </section>

    <div class="dash">
      <!-- 좌: 조작 영역 -->
      <div class="col col-sticky pop">
        <section class="card" id="add-book">
          <div class="card-head"><span class="card-title">읽은 책 추가</span></div>
          <form id="book-form">
            <input type="text" class="input" id="title" placeholder="책 제목" required />
            <input type="text" class="input" id="author" placeholder="저자" required />
            <div class="genre-note"><span class="ai-pill">AUTO</span> 장르는 자동으로 분류해드려요</div>
            <div class="rating-row">
              <span class="lab">내 별점</span>
              <div class="star-picker" id="star-picker" role="radiogroup" aria-label="평점 선택 (1~5)">
                <button type="button" class="star" data-value="1" aria-label="1점">★</button>
                <button type="button" class="star" data-value="2" aria-label="2점">★</button>
                <button type="button" class="star" data-value="3" aria-label="3점">★</button>
                <button type="button" class="star" data-value="4" aria-label="4점">★</button>
                <button type="button" class="star" data-value="5" aria-label="5점">★</button>
              </div>
              <input type="hidden" id="rating" />
            </div>
            <button type="submit" class="btn btn-primary btn-block">추가하기</button>
          </form>
        </section>

        <section class="card" id="search-section">
          <div class="card-head"><span class="card-title">검색</span></div>
          <div class="search-bar">
            <input type="text" class="input" id="search-input" placeholder="제목·저자로 검색" />
            <button id="search-btn" class="btn btn-soft">검색</button>
          </div>
          <div id="search-results"></div>
        </section>

        <section class="card quote-card" id="quote-card" title="다른 문장 보기">
          <span class="quote-mark" aria-hidden="true">“</span>
          <p class="quote-text" id="quote-text"></p>
          <div class="quote-foot"><span class="quote-orn">—</span> 오늘의 문장</div>
        </section>
      </div>

      <!-- 우: 표시 영역 -->
      <div class="col pop">
        <section class="card" id="book-list-section">
          <div class="card-head"><span class="card-title">내 책장</span><span class="count-chip" id="list-count"></span></div>
          <div class="shelf-controls">
            <div class="genre-filters" id="genre-filters"></div>
            <div class="sort-wrap">
              <select id="sort-select" class="sort-select" aria-label="정렬">
                <option value="recent">최근 추가순</option>
                <option value="rating">평점순</option>
                <option value="title">제목순</option>
              </select>
            </div>
          </div>
          <div class="book-scroll" id="book-scroll">
            <div id="book-list"></div>
            <div id="scroll-sentinel"></div>
            <div class="shelf-end" id="shelf-end" hidden></div>
          </div>
        </section>

        <section class="card" id="recommendations-section">
          <div class="card-head"><span class="card-title">오늘의 추천</span><button id="get-recs-btn" class="btn rec-trigger"><span class="spk">✨</span> 추천 받기</button></div>
          <div id="recommendations"><p class="rec-hint">오른쪽 ‘추천 받기’를 누르면 지금까지의 책장을 바탕으로 취향을 분석해 네 권을 골라드려요.</p></div>
        </section>
      </div>
    </div>
  </div>

  <div id="toast-host" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
